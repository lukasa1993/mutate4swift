name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl pytest
      - run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          mutate4swift --version
          mutate4swift --help
      - name: Parse Swift fixture
        run: swiftc -parse tests/fixtures/sample.swift
      - name: End-to-end Swift mutation
        run: |
          mutate4swift --root tests/fixtures/package --max-mutants 1 --test-command "swift test --quiet" --validate-command "swift build --quiet"
          git diff --exit-code -- tests/fixtures/package
